name: Metamoa Top5

on:
  schedule:
    - cron: "*/7 * * * *"   # 7분마다 (GitHub 사정에 따라 몇 분씩 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: metamoa-top5
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1~5위 확인
        run: python3 metamoa_top5.py
      - name: 기록 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ metamoaAPI.txt
          git commit -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase
          git push
