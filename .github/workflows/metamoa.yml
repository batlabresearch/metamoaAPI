name: Metamoa Sansa

on:
  schedule:
    # 정각 혼잡을 피해 매시 03,10,17,24,31,38,45,52,59분에 실행합니다.
    # GitHub 예약 실행은 지연될 수 있고, 59분 다음 03분 사이는 4분입니다.
    - cron: "3-59/7 * * * *"
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: metamoa-top5
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 산사 현재 접속자 수로 최종값 계산
        run: python3 metamoa_top5.py
      - name: 기록 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ metamoaAPI.txt
          git commit -m "기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase
          git push
