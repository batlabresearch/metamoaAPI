name: Metamoa Sansa

on:
  schedule:
    # 실행기 내부의 7분 반복을 보조하는 복구 예약입니다.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "이번 실행 유지 시간(분, 1~300). 다음 실행은 기본 300분."
        type: number
        default: 300
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: metamoa-sansa-worker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GitHub 서버에서 7분마다 갱신
        id: worker
        env:
          RUN_MINUTES: ${{ inputs.run_minutes || 300 }}
        run: python3 -u metamoa_worker.py --run-minutes "$RUN_MINUTES"
      - name: 다음 GitHub 실행 자동 연결
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: |
          if [ "$WORKER_OUTCOME" != "success" ]; then
            sleep 420
          fi
          for attempt in 1 2 3; do
            if gh workflow run metamoa.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            sleep 15
          done
          exit 1
